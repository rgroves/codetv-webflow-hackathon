<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A top-down retro game lounge built entirely with HTML and CSS."
    />
    <title>Retro Studio Lounge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-viewport" aria-label="Top-down retro studio lounge">
      <section class="room" aria-label="Studio lounge floor plan">
        <div class="room__floor" aria-hidden="true"></div>

        <div
          class="architecture architecture--top-wall"
          aria-hidden="true"
        ></div>
        <div
          class="architecture architecture--left-wall"
          aria-hidden="true"
        ></div>
        <div
          class="architecture architecture--right-wall"
          aria-hidden="true"
        ></div>
        <div
          class="architecture architecture--bottom-wall"
          aria-hidden="true"
        ></div>

        <section class="window" aria-label="Wide window with mustard curtains">
          <div class="window__glass window__glass--left"></div>
          <div class="window__glass window__glass--right"></div>
          <div class="window__curtain window__curtain--left"></div>
          <div class="window__curtain window__curtain--right"></div>
        </section>

        <section class="curtained-door" aria-label="Curtained doorway">
          <div class="curtained-door__frame"></div>
          <div class="curtained-door__fabric"></div>
        </section>

        <section class="sofa sofa--green" aria-label="Deep green sofa">
          <div class="sofa__back"></div>
          <div class="sofa__seat sofa__seat--one"></div>
          <div class="sofa__seat sofa__seat--two"></div>
          <div class="sofa__arm sofa__arm--start"></div>
          <div class="sofa__arm sofa__arm--end"></div>
        </section>

        <section class="sofa sofa--orange" aria-label="Bright orange sofa">
          <div class="sofa__back"></div>
          <div class="sofa__seat sofa__seat--one"></div>
          <div class="sofa__seat sofa__seat--two"></div>
          <div class="sofa__arm sofa__arm--start"></div>
          <div class="sofa__arm sofa__arm--end"></div>
          <div class="throw-pillow" aria-hidden="true"></div>
        </section>

        <!-- <section class="pedestal-plant" aria-label="Plant on a red pedestal">
          <div class="pedestal-plant__pot"></div>
          <div class="pedestal-plant__leaf pedestal-plant__leaf--1"></div>
          <div class="pedestal-plant__leaf pedestal-plant__leaf--2"></div>
          <div class="pedestal-plant__leaf pedestal-plant__leaf--3"></div>
          <div class="pedestal-plant__leaf pedestal-plant__leaf--4"></div>
          <div class="pedestal-plant__leaf pedestal-plant__leaf--5"></div>
        </section> -->

        <!-- <section class="end-table" aria-label="Teal side table">
          <div class="end-table__top"></div>
          <div class="end-table__base"></div>
        </section> -->

        <section class="rug" aria-label="Striped area rug">
          <div class="rug__border"></div>
        </section>

        <section class="coffee-table" aria-label="Wood coffee table">
          <div class="coffee-table__top"></div>
          <div class="coffee-table__leg coffee-table__leg--1"></div>
          <div class="coffee-table__leg coffee-table__leg--2"></div>
          <div class="coffee-table__leg coffee-table__leg--3"></div>
          <div class="coffee-table__leg coffee-table__leg--4"></div>
          <div class="coffee-table__vase" aria-hidden="true"></div>
          <div
            class="coffee-table__sprig coffee-table__sprig--1"
            aria-hidden="true"
          ></div>
          <div
            class="coffee-table__sprig coffee-table__sprig--2"
            aria-hidden="true"
          ></div>
          <div
            class="coffee-table__sprig coffee-table__sprig--3"
            aria-hidden="true"
          ></div>
        </section>

        <!-- <section class="media-console" aria-label="Dark wood media console">
          <div class="media-console__cabinet"></div>
          <div class="media-console__screen"></div>
          <div class="media-console__speaker media-console__speaker--top"></div>
          <div class="media-console__speaker media-console__speaker--bottom"></div>
          <div class="media-console__lamp">
            <div class="media-console__lamp-base"></div>
            <div class="media-console__lamp-neck"></div>
            <div class="media-console__lamp-shade"></div>
          </div>
        </section> -->

        <!-- <section class="accent-chair" aria-label="Partial gray accent chair">
          <div class="accent-chair__back"></div>
          <div class="accent-chair__seat"></div>
          <div class="accent-chair__arm accent-chair__arm--left"></div>
          <div class="accent-chair__arm accent-chair__arm--right"></div>
        </section> -->

        <!-- <div class="room__pixel-spark room__pixel-spark--one" aria-hidden="true"></div>
        <div class="room__pixel-spark room__pixel-spark--two" aria-hidden="true"></div> -->
      </section>
    </main>
  </body>
</html>
